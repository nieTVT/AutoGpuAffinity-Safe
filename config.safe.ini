[settings]
# ===========================================================================
# SAFE MODE - recommended, no administrator rights needed
# ===========================================================================
#
# duration to build cache before benchmarking, in seconds
cache_duration=5

# duration to benchmark each cpu, in seconds
benchmark_duration=30

# cpus to benchmark, comma delimited
# e.g. [1,3,6] for CPU 1/3/6, [0..7] for CPU 0 to 7, [] for every cpu
custom_cpus=[0,1,22,23]

# 1 for lava-triangle (Vulkan), 2 for D3D9-benchmark (D3D9)
api=1

# the display adapter is NEVER disabled or re-enabled in this mode.
# every cpu is benchmarked by starting the benchmark process pinned to it
# (/affinity mask). this cannot black-screen the machine.
# restart_driver must stay false here.

restart_driver=false

affinity_devices=[]

# launch the subject with the same affinity mask as the target core
# keeps context switching down; may lower overall fps
sync_driver_affinity=true

# disable the "press enter to start benchmarking" prompt
skip_confirmation=false

# register the benchmark program in the windows per-application gpu preference
# (HKCU\Software\Microsoft\DirectX\UserGpuPreferences) as "high performance",
# so the subject renders on the discrete gpu instead of the adapter that
# currently drives the display. user scoped, no admin rights, reversible from
# windows settings > display > graphics
force_discrete_gpu=true

[MSI Afterburner]
# profile to load on every driver restart, 0 = none
profile=0

# MSIAfterburner.exe location excluding quotes
location=C:\Program Files (x86)\MSI Afterburner\MSIAfterburner.exe

[xperf]
# toggle dpc/isr logging and report generation
enabled=false

# xperf location excluding quotes
location=C:\Program Files (x86)\Windows Kits\10\Windows Performance Toolkit\xperf.exe

# toggle saving the generated etls (needs a lot of disk space)
save_etls=false

[liblava]
# fullscreen mode
fullscreen=true

# resolution is only customizable when fullscreen=false
x_resolution=640
y_resolution=480

# 0 = uncapped
fps_cap=0

# triple buffering
triple_buffering=false

# -1 lets lava-triangle choose (liblava prefers discrete gpus)
# >= 0 appends --physical_device=<n> to force one exact vulkan adapter
# run `py main.py --list-gpus` to list them
physical_device=-1
